<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Session Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #a7f3d0; /* playful mint green outside phone */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* Floating Clouds */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.6;
            animation: float-cloud linear infinite;
            z-index: 0;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .c1 { width: 60px; height: 20px; top: 10%; animation-duration: 25s; }
        .c1::before { width: 30px; height: 30px; top: -15px; left: 10px; }
        .c1::after { width: 20px; height: 20px; top: -10px; right: 10px; }
        
        .c2 { width: 80px; height: 25px; top: 30%; animation-duration: 35s; animation-delay: -10s; }
        .c2::before { width: 40px; height: 40px; top: -20px; left: 15px; }
        .c2::after { width: 25px; height: 25px; top: -12px; right: 15px; }

        .c3 { width: 50px; height: 15px; top: 60%; animation-duration: 20s; animation-delay: -5s; }
        .c3::before { width: 25px; height: 25px; top: -12px; left: 8px; }
        .c3::after { width: 15px; height: 15px; top: -8px; right: 8px; }

        @keyframes float-cloud {
            from { transform: translateX(-100px); }
            to { transform: translateX(600px); }
        }

        /* Chunky 3D Button Styles */
        .btn-3d {
            transition: all 0.1s;
        }
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 0 transparent !important;
        }
        
        /* Bouncy elements */
        .animate-bounce-slow {
            animation: bounce-slow 3s infinite;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Flashing animation for the time bomb */
        @keyframes flash-red {
            0% { background-color: #fca5a5; }
            50% { background-color: #ef4444; }
            100% { background-color: #fca5a5; }
        }
        .bg-flash-red {
            animation: flash-red 0.5s infinite;
        }

        /* Ticking animation for bomb */
        @keyframes tick-tock {
            0% { transform: rotate(-10deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.15); }
            100% { transform: rotate(-10deg) scale(1); }
        }
        .animate-tick {
            animation: tick-tock 0.5s infinite;
        }
        .tick-fast {
            animation: tick-tock 0.25s infinite;
        }
        .tick-crazy {
            animation: tick-tock 0.1s infinite;
        }
        
        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-screen w-full flex justify-center items-center overflow-hidden bg-[#a7f3d0]">
    
    <!-- Phone Wrapper -->
    <div id="phone-wrapper" class="w-full max-w-md h-full sm:h-[95vh] sm:rounded-[3rem] sm:shadow-[0_20px_50px_rgba(0,0,0,0.2)] sm:border-[8px] sm:border-white flex flex-col relative overflow-hidden bg-gradient-to-b from-sky-200 to-purple-100 transition-colors duration-500">
        
        <!-- Animated Clouds Background -->
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>

        <header class="w-full p-4 pb-2 z-10 flex-shrink-0 animate-bounce-slow">
            <div class="bg-white rounded-[2rem] p-3 shadow-lg flex justify-between items-center border-4 border-white relative">
                
                <!-- Yuna & Ryn Score -->
                <div class="flex-1 flex flex-col items-center bg-pink-100 rounded-3xl py-2 shadow-inner border-2 border-pink-200 z-10">
                    <h2 class="text-pink-500 font-bold text-lg md:text-xl uppercase tracking-wider text-center leading-tight">Yuna & Ryn</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <button onclick="updateScore('girls', -1)" class="btn-3d w-9 h-9 rounded-full bg-pink-400 text-white font-bold text-xl shadow-[0_4px_0_0_#be185d] flex items-center justify-center pb-1">-</button>
                        <span id="score-girls" class="text-3xl font-black text-pink-600 w-10 text-center transition-transform duration-200 ease-out">0</span>
                        <button onclick="updateScore('girls', 1)" class="btn-3d w-9 h-9 rounded-full bg-pink-400 text-white font-bold text-xl shadow-[0_4px_0_0_#be185d] flex items-center justify-center pb-1">+</button>
                    </div>
                </div>

                <!-- VS Badge -->
                <div class="mx-2 bg-yellow-400 text-yellow-900 font-black rounded-full w-10 h-10 flex items-center justify-center border-4 border-white shadow-md z-20 absolute left-1/2 -translate-x-1/2 -mt-10 animate-pulse">VS</div>

                <!-- Saad Score -->
                <div class="flex-1 flex flex-col items-center bg-blue-100 rounded-3xl py-2 shadow-inner border-2 border-blue-200 z-10">
                    <h2 class="text-blue-500 font-bold text-lg md:text-xl uppercase tracking-wider text-center leading-tight">Saad</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <button onclick="updateScore('teacher', -1)" class="btn-3d w-9 h-9 rounded-full bg-blue-400 text-white font-bold text-xl shadow-[0_4px_0_0_#1d4ed8] flex items-center justify-center pb-1">-</button>
                        <span id="score-teacher" class="text-3xl font-black text-blue-600 w-10 text-center transition-transform duration-200 ease-out">0</span>
                        <button onclick="updateScore('teacher', 1)" class="btn-3d w-9 h-9 rounded-full bg-blue-400 text-white font-bold text-xl shadow-[0_4px_0_0_#1d4ed8] flex items-center justify-center pb-1">+</button>
                    </div>
                </div>
                
            </div>
        </header>

        <main id="main-content" class="flex-grow w-full flex flex-col relative overflow-hidden transition-colors duration-300 z-10">
        <!-- Game 1: Emoji Challenge -->
        <div id="view-emoji" class="game-view w-full h-full flex flex-col items-center justify-center p-6 gap-6">
            <h1 class="text-3xl font-black text-purple-600 mb-2 text-center">Emoji Challenge</h1>
            
            <div class="bg-white rounded-[2.5rem] w-full p-8 shadow-xl flex justify-center items-center gap-4 min-h-[160px] border-4 border-purple-200">
                <span id="emoji-display" class="text-6xl text-center w-full tracking-widest">❓ ❓ ❓</span>
            </div>
            
            <button onclick="generateEmojis()" class="btn-3d w-full py-4 bg-yellow-400 rounded-full text-yellow-900 font-black text-2xl shadow-[0_8px_0_0_#a16207]">
                🎲 Roll Emojis
            </button>
            
            <div class="w-full mt-4 bg-white/50 rounded-[2rem] p-4 flex flex-col items-center">
                <div id="emoji-timer-display" class="text-5xl font-black text-purple-800 mb-4 font-mono">60s</div>
                <button onclick="startTimer('emoji', 60)" class="btn-3d w-full py-3 bg-purple-500 rounded-full text-white font-black text-xl shadow-[0_6px_0_0_#6b21a8]">
                    ⏱️ Start 60s Timer
                </button>
            </div>
        </div>

        <!-- Game 2: Word Chain -->
        <div id="view-word" class="game-view hidden w-full h-full flex flex-col items-center justify-center p-6 gap-6">
            <h1 class="text-3xl font-black text-emerald-600 mb-2 text-center">Word Chain</h1>
            
            <div class="bg-white rounded-[3rem] w-64 h-64 shadow-xl flex flex-col justify-center items-center border-4 border-emerald-200 p-4">
                <span class="text-emerald-400 font-bold mb-2">Timer</span>
                <span id="word-timer-display" class="text-7xl font-black text-emerald-700 font-mono">15</span>
            </div>
            
            <button onclick="startTimer('word', 15)" class="btn-3d w-full py-5 bg-emerald-400 rounded-full text-white font-black text-2xl shadow-[0_8px_0_0_#047857] mt-8">
                ⏳ Start 15s Turn
            </button>
            <button onclick="resetTimer('word', 15)" class="text-emerald-600 font-bold text-lg mt-4 underline decoration-2 underline-offset-4">Reset Timer</button>
        </div>

        <!-- Game 3: 20 Questions -->
        <div id="view-twenty" class="game-view hidden w-full h-full flex flex-col items-center justify-center p-6 gap-6">
            <h1 class="text-3xl font-black text-blue-600 mb-2 text-center">20 Questions</h1>
            
            <div class="bg-white rounded-[3rem] w-64 h-64 shadow-xl flex flex-col justify-center items-center border-4 border-blue-200 relative">
                <span class="text-blue-400 font-bold mb-2 absolute top-6">Questions Asked</span>
                <span id="twenty-count" class="text-8xl font-black text-blue-700">0</span>
                <span class="text-blue-400 font-bold mt-2 absolute bottom-6">/ 20</span>
            </div>
            
            <button onclick="addQuestion()" class="btn-3d w-full py-5 bg-blue-500 rounded-full text-white font-black text-2xl shadow-[0_8px_0_0_#1d4ed8] mt-8">
                +1 Question
            </button>
            <button onclick="resetQuestions()" class="text-blue-600 font-bold text-lg mt-4 underline decoration-2 underline-offset-4">Reset Counter</button>
        </div>

        <!-- Game 4: Blindfold Drawing -->
        <div id="view-blindfold" class="game-view hidden w-full h-full flex flex-col items-center justify-center p-6 gap-6">
            <h1 class="text-3xl font-black text-rose-600 mb-2 text-center">Blindfold Drawing</h1>
            
            <div class="bg-white rounded-[2.5rem] w-full p-8 shadow-xl flex justify-center items-center text-center min-h-[200px] border-4 border-rose-200">
                <span id="drawing-prompt" class="text-3xl font-black text-rose-700 leading-snug">Tap below to get a secret drawing!</span>
            </div>
            
            <button onclick="generatePrompt()" class="btn-3d w-full py-5 bg-rose-400 rounded-full text-white font-black text-2xl shadow-[0_8px_0_0_#be123c] mt-4">
                🎨 New Secret Word
            </button>
        </div>

        <!-- Game 5: Time Bomb -->
        <div id="view-bomb" class="game-view hidden w-full h-full flex flex-col items-center justify-center p-6 gap-6 transition-colors duration-300">
            <h1 id="bomb-title" class="text-4xl font-black text-gray-800 mb-2 text-center drop-shadow-md">Time Bomb!</h1>
            
            <div id="bomb-container" class="flex flex-col items-center justify-center min-h-[250px]">
                <span id="bomb-icon" class="text-9xl drop-shadow-2xl transition-transform">💣</span>
                <h2 id="boom-text" class="hidden text-7xl font-black text-yellow-300 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] mt-4">BOOM!</h2>
            </div>
            
            <button id="bomb-btn" onclick="startBomb()" class="btn-3d w-full py-5 bg-red-500 rounded-full text-white font-black text-3xl shadow-[0_8px_0_0_#991b1b] mt-8">
                🔥 START BOMB
            </button>
        </div>

    </main>

    <!-- Navigation Footer -->
    <nav class="bg-white border-t-2 border-gray-100 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.1)] rounded-t-[2rem] px-2 py-4 pb-8 flex justify-around items-end z-10 flex-shrink-0">
        <button onclick="switchTab('emoji')" class="nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl bg-purple-100 text-purple-600 transition-all">
            <span class="text-2xl mb-1">😀</span>
            <span class="text-[10px] font-bold">Emoji</span>
        </button>
        <button onclick="switchTab('word')" class="nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl text-gray-400 transition-all">
            <span class="text-2xl mb-1">🔗</span>
            <span class="text-[10px] font-bold">Words</span>
        </button>
        <button onclick="switchTab('twenty')" class="nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl text-gray-400 transition-all">
            <span class="text-2xl mb-1">❓</span>
            <span class="text-[10px] font-bold">20 Q's</span>
        </button>
        <button onclick="switchTab('blindfold')" class="nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl text-gray-400 transition-all">
            <span class="text-2xl mb-1">🙈</span>
            <span class="text-[10px] font-bold">Draw</span>
        </button>
        <button onclick="switchTab('bomb')" class="nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl text-gray-400 transition-all">
            <span class="text-2xl mb-1">💣</span>
            <span class="text-[10px] font-bold">Bomb</span>
        </button>
    </nav>
    
    </div> <!-- Close Phone Wrapper -->

    <script>
        // State
        const scores = { girls: 0, teacher: 0 };
        let activeTimer = null;
        let bombTimeout = null;
        
        // Data Arrays
        const emojiSubjects = ['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🦁','👽','👸','🤖','👻','🤠','🦄','🐵','🦖'];
        const emojiActionsEnv = ['🏃','🚀','🌧️','🚗','🚲','✈️','⛵','☀️','❄️','⚡','🔥','🌊','🏕️','🎡','🛴','🚁'];
        const emojiObjects = ['🍎','🎈','🎸','🍔','🎁','🍕','🍦','⚽','🏀','📚','⌚','📱','🔑','🧸','🍉','🍩'];
        const prompts = [
            "A happy cat wearing a hat.",
            "A big house with two doors.",
            "A scary monster with three eyes.",
            "A tall tree with red apples.",
            "A sun wearing sunglasses.",
            "A dog eating a pizza.",
            "A small mouse on a big elephant.",
            "A robot cleaning the room.",
            "A fish flying in the sky.",
            "A monkey eating a yellow banana.",
            "A car with square wheels.",
            "A snowman drinking hot chocolate.",
            "A bird carrying a bag.",
            "An alien with four arms.",
            "A bear sleeping on a bed."
        ];

        // --- Core Functions ---

        function updateScore(team, change) {
            scores[team] += change;
            if(scores[team] < 0) scores[team] = 0; // Prevent negative scores
            const el = document.getElementById(`score-${team}`);
            el.innerText = scores[team];
            
            // Pop animation
            el.classList.add('scale-[1.8]', 'text-yellow-400', 'drop-shadow-lg');
            setTimeout(() => el.classList.remove('scale-[1.8]', 'text-yellow-400', 'drop-shadow-lg'), 250);
        }

        function switchTab(tabId) {
            // Stop any active timers when switching tabs
            clearInterval(activeTimer);
            clearTimeout(bombTimeout);
            resetBombUI();
            
            // Hide all views
            document.querySelectorAll('.game-view').forEach(el => el.classList.add('hidden'));
            
            // Show target view
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            
            // Update nav buttons styles
            const navBtns = document.querySelectorAll('.nav-btn');
            navBtns.forEach(btn => {
                btn.className = 'nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl text-gray-400 transition-all';
            });
            
            // Highlight active nav button (find the one clicked based on context)
            const activeBtn = event.currentTarget || navBtns[0]; // fallback for initial load if needed
            
            // Apply specific active colors based on tab
            if(tabId === 'emoji') activeBtn.className = 'nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl bg-purple-200 text-purple-700 transition-all scale-110 shadow-lg border-2 border-purple-300';
            if(tabId === 'word') activeBtn.className = 'nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl bg-emerald-200 text-emerald-700 transition-all scale-110 shadow-lg border-2 border-emerald-300';
            if(tabId === 'twenty') activeBtn.className = 'nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl bg-blue-200 text-blue-700 transition-all scale-110 shadow-lg border-2 border-blue-300';
            if(tabId === 'blindfold') activeBtn.className = 'nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl bg-rose-200 text-rose-700 transition-all scale-110 shadow-lg border-2 border-rose-300';
            if(tabId === 'bomb') activeBtn.className = 'nav-btn w-16 h-16 flex flex-col items-center justify-center rounded-2xl bg-red-200 text-red-700 transition-all scale-110 shadow-lg border-2 border-red-300';
            
            // Reset state for the view
            if(tabId === 'emoji') document.getElementById('emoji-timer-display').innerText = '60s';
            if(tabId === 'word') resetTimer('word', 15);
        }


        // Game 1: Emoji
        function generateEmojis() {
            // Select one from each category for better sentence building (Subject + Action/Environment + Object)
            const subject = emojiSubjects[Math.floor(Math.random() * emojiSubjects.length)];
            const actionEnv = emojiActionsEnv[Math.floor(Math.random() * emojiActionsEnv.length)];
            const object = emojiObjects[Math.floor(Math.random() * emojiObjects.length)];
            
            const selected = [subject, actionEnv, object];
            const display = document.getElementById('emoji-display');
            display.innerText = selected.join(' ');
            
            // Add a little pop animation
            display.style.transform = 'scale(1.2)';
            setTimeout(() => display.style.transform = 'scale(1)', 150);
        }

        // Generic Timer Function
        function startTimer(prefix, seconds) {
            clearInterval(activeTimer);
            let timeLeft = seconds;
            const display = document.getElementById(`${prefix}-timer-display`);
            
            display.innerText = prefix === 'emoji' ? `${timeLeft}s` : timeLeft;
            display.classList.remove('text-red-500');
            
            activeTimer = setInterval(() => {
                timeLeft--;
                display.innerText = prefix === 'emoji' ? `${timeLeft}s` : timeLeft;
                
                if (timeLeft <= 5) {
                    display.classList.add('text-red-500'); // Turn red at 5 seconds
                }
                
                if (timeLeft <= 0) {
                    clearInterval(activeTimer);
                    display.innerText = "0";
                    // Visual cue it ended
                    display.parentElement.classList.add('bg-red-100');
                    setTimeout(() => display.parentElement.classList.remove('bg-red-100'), 500);
                }
            }, 1000);
        }

        function resetTimer(prefix, seconds) {
            clearInterval(activeTimer);
            const display = document.getElementById(`${prefix}-timer-display`);
            display.innerText = prefix === 'emoji' ? `${seconds}s` : seconds;
            display.classList.remove('text-red-500');
        }

        // Game 3: 20 Questions
        let qCount = 0;
        function addQuestion() {
            if (qCount < 20) {
                qCount++;
                const display = document.getElementById('twenty-count');
                display.innerText = qCount;
                display.classList.add('scale-125');
                setTimeout(() => display.classList.remove('scale-125'), 100);
                
                if(qCount === 20) {
                    display.classList.add('text-red-600');
                }
            }
        }
        function resetQuestions() {
            qCount = 0;
            const display = document.getElementById('twenty-count');
            display.innerText = qCount;
            display.classList.remove('text-red-600');
        }

        // Game 4: Blindfold
        function generatePrompt() {
            const display = document.getElementById('drawing-prompt');
            const r = Math.floor(Math.random() * prompts.length);
            display.innerText = prompts[r];
            
            display.classList.add('scale-110');
            setTimeout(() => display.classList.remove('scale-110'), 150);
        }

        // Game 5: Time Bomb
        function startBomb() {
            clearTimeout(bombTimeout);
            resetBombUI();
            
            const btn = document.getElementById('bomb-btn');
            const icon = document.getElementById('bomb-icon');
            const title = document.getElementById('bomb-title');
            
            // Hide button, start animation
            btn.classList.add('hidden');
            icon.classList.add('animate-tick');
            icon.classList.remove('tick-fast', 'tick-crazy');
            title.innerText = "Pass the phone!";
            title.classList.add('text-red-600', 'animate-pulse');
            
            // Random time between 30 and 90 seconds (30000ms - 90000ms)
            const minTime = 30000; 
            const maxTime = 90000;
            const randomDelay = Math.floor(Math.random() * (maxTime - minTime + 1)) + minTime;
            
            // Make it tick faster as time goes on
            const fastTickTime = randomDelay * 0.5; // Starts ticking fast at 50% time
            const crazyTickTime = randomDelay * 0.8; // Starts ticking crazy at 80% time

            setTimeout(() => {
                if(!icon.classList.contains('hidden')) {
                    icon.classList.remove('animate-tick');
                    icon.classList.add('tick-fast');
                }
            }, fastTickTime);

            setTimeout(() => {
                if(!icon.classList.contains('hidden')) {
                    icon.classList.remove('tick-fast');
                    icon.classList.add('tick-crazy');
                }
            }, crazyTickTime);

            bombTimeout = setTimeout(() => {
                explodeBomb();
            }, randomDelay);
        }

        function explodeBomb() {
            const icon = document.getElementById('bomb-icon');
            const boomText = document.getElementById('boom-text');
            const view = document.getElementById('view-bomb');
            const btn = document.getElementById('bomb-btn');
            const title = document.getElementById('bomb-title');
            const wrapper = document.getElementById('phone-wrapper');
            
            // Stop tick, show explosion
            icon.classList.remove('animate-tick', 'tick-fast', 'tick-crazy');
            icon.classList.add('hidden');
            boomText.classList.remove('hidden');
            boomText.classList.add('animate-bounce');
            title.innerText = "GAME OVER";
            title.classList.remove('animate-pulse');
            
            // Flash screen
            view.classList.add('bg-flash-red');
            wrapper.classList.remove('from-sky-200', 'to-purple-100');
            wrapper.classList.add('bg-red-900');
            
            // Reset after 3 seconds
            setTimeout(() => {
                resetBombUI();
                btn.classList.remove('hidden');
                btn.innerText = "🔄 PLAY AGAIN";
            }, 4000);
        }

        function resetBombUI() {
            const icon = document.getElementById('bomb-icon');
            const boomText = document.getElementById('boom-text');
            const view = document.getElementById('view-bomb');
            const title = document.getElementById('bomb-title');
            const wrapper = document.getElementById('phone-wrapper');
            
            icon.classList.remove('hidden', 'animate-tick', 'tick-fast', 'tick-crazy');
            boomText.classList.add('hidden');
            boomText.classList.remove('animate-bounce');
            view.classList.remove('bg-flash-red');
            
            wrapper.classList.add('from-sky-200', 'to-purple-100');
            wrapper.classList.remove('bg-red-900');
            
            title.innerText = "Time Bomb!";
            title.classList.remove('text-red-600', 'animate-pulse');
            document.getElementById('bomb-btn').classList.remove('hidden');
        }

    </script>
</body>
</html>
